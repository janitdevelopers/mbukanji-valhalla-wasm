# Publish @jansoft/mbujkanji-valhalla-wasm to npm.
#
# Builds WASM in Docker, runs tests and verification, then publishes.
#
# Triggers:
#   - GitHub Release published: run workflow, then publish (version must match release tag)
#   - Manual: Actions → "Deploy to npm" → Run workflow
#
# Setup:
#   - Add repository secret DEPLOY_TO_NPM: npm token with "Automation" or
#     "Publish" scope (https://www.npmjs.com/settings/~youruser/tokens).
#
# Release flow:
#   1. Bump version in package.json (e.g. npm version patch)
#   2. Create a GitHub Release with tag v<version> (e.g. v0.1.2)
#   3. This workflow runs; it verifies the release tag matches package.json, then publishes.

name: Deploy to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-wasm:
    name: Build WASM (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build WASM in Docker
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker build -t valhalla-wasm-builder ./native

      - name: Extract WASM artifacts
        run: |
          mkdir -p wasm-out
          docker run --rm -v "$PWD/wasm-out:/artifacts" valhalla-wasm-builder
          ls -la wasm-out/
          test -f wasm-out/valhalla.wasm || (echo "Docker did not produce wasm-out/valhalla.wasm" && exit 1)
          test -f wasm-out/valhalla.js || (echo "Docker did not produce wasm-out/valhalla.js" && exit 1)

      # Upload as wasm/ so download extracts to workspace with wasm/valhalla.wasm and wasm/valhalla.js
      - name: Prepare WASM artifact
        run: |
          mkdir -p wasm
          cp wasm-out/valhalla.wasm wasm-out/valhalla.js wasm/
          ls -la wasm/

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: wasm/
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Build package and publish to npm
    runs-on: ubuntu-latest
    needs: build-wasm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Download into wasm/ so valhalla.wasm and valhalla.js land where tsup/build expect them
      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm
          path: wasm/

      - name: Verify WASM files present
        run: |
          test -f wasm/valhalla.wasm || (echo "Missing wasm/valhalla.wasm" && exit 1)
          test -f wasm/valhalla.js || (echo "Missing wasm/valhalla.js" && exit 1)
          echo "WASM files OK"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # On release trigger, ensure release tag matches package.json version
      - name: Verify version (release only)
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${TAG#v}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Version OK: $PKG_VERSION"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Verify WASM files
        run: node scripts/verify-wasm.js

      - name: Run tests
        run: pnpm run test:run

      - name: Publish dry-run
        run: pnpm publish --dry-run

      - name: Publish to npm
        run: pnpm publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DEPLOY_TO_NPM }}
